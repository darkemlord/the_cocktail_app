services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
    environment:
      DB_HOST: db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # System specs drive this remote browser; without it they use a local Chrome (CI)
      SELENIUM_URL: http://chrome:4444/wd/hub
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433 on the host to avoid clashing with other local Postgres instances
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Headless browser for system specs. Watch it live at http://localhost:7900 (password: secret)
  chrome:
    image: selenium/standalone-chromium:156.0-20261101
    shm_size: 2gb
    ports:
      - "7900:7900"

volumes:
  postgres_data:
